  for (const d of devList){
    const isL2Ref = state.view === 'l3' && L3M && !L3M.routerIds.has(d.id) && !d.custom; // L2重ね表示の参考機器(管理SVIのみの機器を含む)
    const p = nodePos(d);
    const attrs = { class: 'node' + (state.selectedDevice === d.id || isSelected(d.id) ? ' sel' : ''), transform: `translate(${p.x},${p.y})` };
    if (devDimmed(d)) attrs.opacity = 0.15;
    else if (isL2Ref) attrs.opacity = 0.42;
    const grp = el('g', attrs);
    const sc = stackCount(d);
    if (sc > 1){ // スタック: 背面に重ね箱
      grp.append(el('rect', { x: 10, y: 10, width: NODE_W, height: NODE_H, rx: 8, fill: '#DDE7EF', stroke: '#9FB4C6', 'stroke-width': 1 }));
      grp.append(el('rect', { x: 5, y: 5, width: NODE_W, height: NODE_H, rx: 8, fill: '#EDF3F7', stroke: '#9FB4C6', 'stroke-width': 1 }));
    }
    let kind = devKind(d);
    if (!d.custom && ['router','l3sw','sw'].includes(d.dispType)) kind = d.dispType === 'l3sw' ? 'l3sw' : d.dispType;
    const ct = d.custom ? (CTYPES[d.ctype] || CTYPES.other)
      : (CTYPES[d.dispType] || null);
    const fill = d.color || '#FFFFFF';
    const dark = isDark(fill);
    drawBody(grp, d, fill);
    grp.append(el('rect', { width: 6, height: NODE_H, rx: 3,
      fill: ct ? ct.color : kind === 'router' ? '#B0713A' : d.isL3 ? '#365B7A' : '#7FA6C4' }));
    grp.append(el('text', { class: 'hn', x: 14, y: 20, ...(dark ? { style: 'fill:#F4F8FB' } : {}) }, clipUnits(d.hostname, 20)));
    const chip = (ct ? ct.chip : kind === 'router' ? 'RT' : kind === 'l3sw' ? 'L3' : 'SW') + (sc > 1 ? '×' + sc : '');
    const cw = chip.length * 6.5 + 10;
    grp.append(el('rect', { x: NODE_W - cw - 8, y: 8, width: cw, height: 14, rx: 3, fill: '#EEF3F7', stroke: '#9FB4C6', 'stroke-width': 0.8 }));
    grp.append(el('text', { x: NODE_W - 8 - cw / 2, y: 18.5, 'text-anchor': 'middle', 'font-size': 9, 'font-weight': 700, fill: '#44586C', 'font-family': 'var(--mono)' }, chip));
    let y = 28;
    if (roots[d.id]){
      const vls = vlanSummaryStr(roots[d.id], 14);
      grp.append(el('rect', { x: 14, y: y, width: 9 * 6 + textUnits(vls) * 5.6 + 10, height: 13, rx: 3, fill: '#C9A227' }));
      grp.append(el('text', { x: 18, y: y + 10, 'font-size': 9, 'font-weight': 700, fill: '#211A00', 'font-family': 'var(--mono)' }, 'STP ROOT ' + vls));
      y += 17;
    }
    const sub1 = state.view === 'physical' ? (d.location || '設置場所 未設定')
      : state.view === 'l3' ? (routingStr(d) ||
          (d.custom ? (d.mgmtIp || (CTYPES[d.ctype] || CTYPES.other).label)
            : isL2Ref ? 'L2スイッチ(参考表示)' : 'ルーティングプロトコルなし'))
      : d.custom ? (d.mgmtIp || (CTYPES[d.ctype] || CTYPES.other).label)
      : `VLAN: ${Object.keys(d.vlans).length ? vlanSummaryStr(Object.keys(d.vlans).map(Number), 24) : '-'}`;
    grp.append(el('text', { class: 'loc', x: 14, y: y + 11, ...(dark ? { style: 'fill:#D7E3ED' } : {}) }, clipUnits(sub1, 32)));
    const fh = new Set();
    Object.values(d.interfaces).forEach(it => (it.fhrp || []).forEach(f => fh.add(f.type)));
    const bits = d.autoEdge
      ? [`${d.autoEdge.hosts.length}台 / ${new Set(d.autoEdge.hosts.map(h => h.port)).size}ポート / VLAN:${vlanSummaryStr([...new Set(d.autoEdge.hosts.map(h => h.vlan))].sort((a,b)=>a-b), 14) || '-'}`]
      : d.custom
      ? ['Port: ' + Object.keys(d.interfaces).slice(0, 3).join(', ').slice(0, 24)]
      : ['IF:' + Object.keys(d.interfaces).filter(isPhysicalIf).length];
    if ((d.routing || []).length) bits.push(d.routing.map(r => r.split(' ')[0]).join('/'));
    if (d.staticRoutes) bits.push('St×' + d.staticRoutes);
    if ((d.acls || []).length) bits.push('ACL:' + d.acls.length);
    if (fh.size) bits.push([...fh].join('/'));
    grp.append(el('text', { class: 'sub', x: 14, y: y + 24, ...(dark ? { style: 'fill:#C4D3DF' } : {}) }, clipUnits(bits.join(' '), 29)));
    enableDrag(grp, d.id, shift => {
      if (shift){
        setSelection(isSelected(d.id) ? state.sel.filter(x => x !== d.id) : [...state.sel, d.id]);
        return;
      }
      state.sel = [d.id]; state.selectedDevice = d.id; state.selectedNote = null;
      state.sideTab = 'detail'; renderSide(); refreshSelClasses();
    });
    NODE_ELS.set(d.id, grp);
    g.append(grp);
  }
}

  const g = LAYERS.gNotes; g.textContent = ''; NOTE_ELS.clear();
  for (const n of state.notes){
    if (n.view !== state.view) continue;
    const fill = n.color || '#FFF7CC';
    const dark = isDark(fill);
    const lines = String(n.text || '').split('\n');
    const w = Math.min(440, Math.max(84, Math.max(...lines.map(l => textUnits(l))) * 6.1 + 24));

function rebuildGroups(){
  const g = LAYERS.gGroups; g.textContent = '';
  if (state.view !== 'physical') return;
  const groups = {};
  state.devices.forEach(d => (groups[d.location || '未設定'] = groups[d.location || '未設定'] || []).push(d));
  for (const [loc, arr] of Object.entries(groups)){
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    arr.forEach(d => { const p = nodePos(d);
      x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y);
      x2 = Math.max(x2, p.x + NODE_W); y2 = Math.max(y2, p.y + NODE_H); });
    const pad = 26;
    g.append(el('rect', { class: 'grp-box', x: x1 - pad, y: y1 - pad - 14, width: x2 - x1 + pad * 2, height: y2 - y1 + pad * 2 + 14, rx: 12 }));
    g.append(el('text', { class: 'grp-lbl', x: x1 - pad + 12, y: y1 - pad + 4 }, '📍 ' + loc));
  }
}

// ---------------- drag (差分更新・全再描画なし) ----------------
let _raf = 0;
const _dragDevs = new Set();
function scheduleLinkRebuild(devIds){
  if (devIds) (Array.isArray(devIds) ? devIds : [devIds]).forEach(id => _dragDevs.add(id));
  if (_raf) return;
  _raf = requestAnimationFrame(() => {
    _raf = 0;
    if (_dragDevs.size > 10){ _dragDevs.clear(); rebuildLinks(); }
    else if (_dragDevs.size){ for (const id of _dragDevs) rebuildLinks(id); _dragDevs.clear(); }
    else rebuildLinks();
    if (state.view === 'physical') rebuildGroups();
  });
}
function enableDrag(grp, id, onClick){
  let st = null;
  grp.addEventListener('pointerdown', ev => {
    ev.preventDefault(); ev.stopPropagation();
    try { grp.setPointerCapture(ev.pointerId); } catch {}
    const targets = (isSelected(id) && state.sel.length > 1) ? [...state.sel] : [id];
    const starts = new Map();
    for (const tid of targets){
      if (String(tid).startsWith('seg:')){
        const p = state.l3SegPos[String(tid).slice(4)] || { x: 100, y: 100 };
        starts.set(tid, { ...p }); continue;
      }
      const d = devById(tid);
      if (d){ starts.set(tid, { ...nodePos(d) }); continue; }
      const n = state.notes.find(x => x.id === tid);
      if (n) starts.set(tid, { x: n.x, y: n.y });
    }
    st = { mx: ev.clientX, my: ev.clientY, targets, starts, moved: false, shift: ev.shiftKey };
  });
  grp.addEventListener('pointermove', ev => {
    if (!st) return;
    const z = state.zoom || 1;
    const dx = (ev.clientX - st.mx) / z, dy = (ev.clientY - st.my) / z;
    if (Math.abs(dx) + Math.abs(dy) > 2) st.moved = true;
    if (!st.moved) return;
    applyDragDelta(st, dx, dy);
  });
  const end = () => {
    if (!st) return;
    const { moved, shift } = st; st = null;
    if (moved){ growCanvasIfNeeded(); scheduleAutosave(); }
    else onClick(shift);
  };
  grp.addEventListener('pointerup', end);
  grp.addEventListener('pointercancel', end);
}
function applyDragDelta(st, dx, dy){
  const devIds = [];
  let segMoved = false;
  for (const tid of st.targets){
    const s = st.starts.get(tid); if (!s) continue;
    if (String(tid).startsWith('seg:')){
      const key = String(tid).slice(4);
      const nx = Math.max(10, s.x + dx), ny = Math.max(34, s.y + dy);
      state.l3SegPos[key] = { x: nx, y: ny };
      const g = SEG_ELS.get(tid);
      if (g) g.setAttribute('transform', `translate(${nx},${ny})`);
      segMoved = true;
      continue;
    }
    const d = devById(tid);
    if (d){
      const nx = Math.max(10, s.x + dx), ny = Math.max(34, s.y + dy);
      setNodePos(d, { x: nx, y: ny });
      const g = NODE_ELS.get(tid);
      if (g) g.setAttribute('transform', `translate(${nx},${ny})`);
      devIds.push(tid);
      continue;
    }
    const n = state.notes.find(x => x.id === tid);
    if (n){
      n.x = Math.max(10, s.x + dx); n.y = Math.max(20, s.y + dy);
      const g = NOTE_ELS.get(tid);
      if (g) g.setAttribute('transform', `translate(${n.x},${n.y})`);
    }
  }
  if (devIds.length || segMoved) scheduleLinkRebuild(devIds);
}

  const maTa = el('textarea', { rows: 5, placeholder: 'SW-01#show mac address-table\n Vlan  Mac Address     Type     Ports\n  10  0050.5689.abcd  DYNAMIC  Gi1/0/5\n...\nRT-01#show ip arp\nInternet 192.168.10.45  5  0050.5689.abcd ARPA Vlan10\n\n※ MACテーブルとARP(IP解決用)をまとめて貼り付け可。複数機器分はプロンプト行で区切り' });

      el('button', { class: 'btn ghost', onclick: () => {
        const g = generateEdgeDevices();
        commitHistory();
        toast(g.nGroups ? `末端グループ ${g.nGroups}個(${g.nHosts}台)を再生成しました` : '取込済みのMACテーブルがありません');
        renderAll();
      } }, '再生成'),
      el('button', { class: 'btn ghost', onclick: () => {
        const n = state.devices.filter(d => d.autoEdge).length;
        const ids = new Set(state.devices.filter(d => d.autoEdge).map(d => d.id));
        state.devices = state.devices.filter(d => !d.autoEdge);
        state.links = state.links.filter(l => !ids.has(l.a.dev) && !ids.has(l.b.dev));

    if (d.isL3) nm.append(el('span', { class: 'badge l3' }, 'L3'));

function renderSideLinks(body){
  body.append(el('h3', {}, 'CDPネイバー貼り付け(show cdp neighbors detail)'));
  const sel = el('select', { style: 'width:100%;margin-bottom:6px' },
    el('option', { value: '' }, '── 出力元の機器を選択 ──'));
  state.devices.forEach(d => sel.append(el('option', { value: d.id }, d.hostname)));
  const ta = el('textarea', { rows: 5, placeholder: 'Device ID: DIST-SW1\n...\nInterface: TenGigabitEthernet1/0/1,  Port ID (outgoing port): TenGigabitEthernet1/0/49' });
  body.append(sel, ta,
    el('div', { style: 'margin:8px 0' },
      el('button', { class: 'btn', onclick: () => parseCdp(ta.value, sel.value) }, 'CDP解析'),
      ' ',
      el('button', { class: 'btn ghost', onclick: () => { const n = inferLinksFromDescriptions(); toast(`descriptionから ${n} 本追加`); renderAll(); } }, 'descriptionから再推定')));

  const unres = unresolvedDescs();
  if (unres.length){
    body.append(el('h3', {}, `未解決のdescription(${unres.length}件)`));
    body.append(el('div', { style: 'font-size:10.5px;color:var(--txt-dim);margin-bottom:6px' },
      '接続先らしき記載があるのに機器と一致しなかったポートです。誤記の可能性があります。'));
    const shown = unres.slice(0, 30);
    for (const r of shown){
      const box = el('div', { class: 'dev-card', style: 'cursor:default' });
      box.append(el('div', { style: 'font-family:var(--mono);font-size:11px;font-weight:700' },
        `${r.dev.hostname} ${shortIf(r.port)}`));
      box.append(el('div', { style: 'font-size:10.5px;color:var(--txt-dim);word-break:break-all' },
        'desc: ' + clipUnits(r.desc, 52)));
      if (r.cand && r.rport){
        const row = el('div', { style: 'margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap' });
        row.append(el('span', { style: 'font-size:10.5px;color:#F3E4BE' },
          (r.dist === 0 ? '候補: ' : `類似候補(誤記?): `) + r.cand.hostname + ' ' + shortIf(r.rport)));
        row.append(el('button', { class: 'btn ghost', style: 'padding:2px 10px;font-size:11px', onclick: () => {
          const a = { dev: r.dev.id, port: r.port }, b = { dev: r.cand.id, port: r.rport };
          if (linkExists(a, b)) return toast('既に接続があります');
          state.links.push({ id: uid(), a, b, media: decideMedia(a, b), source: 'desc' });
          toast(`接続しました: ${r.dev.hostname} ${shortIf(r.port)} ↔ ${r.cand.hostname} ${shortIf(r.rport)}`);
          renderAll();
        } }, 'この候補で接続'));
        box.append(row);
      }
      body.append(box);
    }
    if (unres.length > 30)
      body.append(el('div', { class: 'hint', style: 'margin-bottom:8px' }, `他 ${unres.length - 30} 件`));
  }

  body.append(el('h3', {}, `接続一覧(${state.links.length}本)`));
  const tbl = el('table', { class: 'conn' });
  tbl.append(el('tr', {}, el('th', {}, '機器A / ポート'), el('th', {}, '機器B / ポート'), el('th', {}, '種別'), el('th', {}, '')));
  const mediaJa = { fiber: '光', utp: 'UTP', dac: 'DAC', unknown: '?' };
  const devOpts = (cur) => {
    const s = el('select');
    state.devices.forEach(d => s.append(el('option', { value: d.id, ...(d.id === cur ? { selected: '' } : {}) }, d.hostname)));
    return s;
  };
  const portOpts = (devId, cur) => {
    const s = el('select');
    const d = devById(devId);
    const ports = d ? Object.keys(d.interfaces).filter(isPhysicalIf) : [];
    if (cur && !ports.includes(cur)) ports.unshift(cur);
    ports.forEach(p => s.append(el('option', { value: p, ...(p === cur ? { selected: '' } : {}) }, shortIf(p))));
    return s;
  };
  const frag = document.createDocumentFragment();
  for (const l of state.links){
    const tr = el('tr');
    if (editingLink === l.id){
      const dA = devOpts(l.a.dev), pA = portOpts(l.a.dev, l.a.port);
      const dB = devOpts(l.b.dev), pB = portOpts(l.b.dev, l.b.port);
      dA.onchange = () => { l.a.dev = dA.value; l.a.port = Object.keys(devById(dA.value).interfaces).filter(isPhysicalIf)[0] || ''; renderAll(); };
      pA.onchange = () => { l.a.port = pA.value; renderCanvas(); };
      dB.onchange = () => { l.b.dev = dB.value; l.b.port = Object.keys(devById(dB.value).interfaces).filter(isPhysicalIf)[0] || ''; renderAll(); };
      pB.onchange = () => { l.b.port = pB.value; renderCanvas(); };
      const med = el('select');
      [['fiber','光'],['utp','UTP'],['dac','DAC'],['unknown','?']].forEach(([v,lbl]) =>
        med.append(el('option', { value: v, ...(v === l.media ? { selected: '' } : {}) }, lbl)));
      med.onchange = () => { l.media = med.value; renderCanvas(); };
      tr.append(
        el('td', {}, dA, pA), el('td', {}, dB, pB), el('td', {}, med),
        el('td', {}, el('button', { class: 'btn ghost', style: 'padding:2px 6px;font-size:11px', onclick: () => { editingLink = null; renderSide(); } }, '完了')));
    } else {
      const dA = devById(l.a.dev), dB = devById(l.b.dev);
      const cell = (d, port) => el('td', { style: 'font-family:var(--mono)' },
        el('div', { style: 'font-weight:700' }, d?.hostname || '?'),
        el('div', { style: 'color:var(--txt-dim)' }, shortIf(port)));
      tr.append(
        cell(dA, l.a.port), cell(dB, l.b.port),
        el('td', {}, mediaJa[l.media] || '?', el('div', {}, el('span', { class: 'src-tag ' + l.source }, { desc: 'desc', cdp: 'CDP', manual: '手動' }[l.source] || l.source))),
        el('td', {},
          el('button', { class: 'del', style: 'color:var(--accent)', title: '編集', onclick: () => { editingLink = l.id; renderSide(); } }, '✎'),
          el('button', { class: 'del', title: '削除', onclick: () => { state.links = state.links.filter(x => x !== l); renderAll(); } }, '✕')));
    }
    frag.append(tr);
  }
  tbl.append(frag);
  body.append(tbl);
  body.append(el('div', { style: 'margin-top:8px' },
    el('button', { class: 'btn', onclick: () => {
      if (state.devices.length < 1) return toast('先に機器を追加してください');
      const d0 = state.devices[0];
      const p0 = Object.keys(d0.interfaces).filter(isPhysicalIf)[0] || 'GigabitEthernet0/1';
      const nl = { id: uid(), a: { dev: d0.id, port: p0 }, b: { dev: (state.devices[1]||d0).id, port: p0 }, media: 'utp', source: 'manual' };
      state.links.push(nl); editingLink = nl.id;
      renderAll();
    } }, '+ 接続を手動追加')));
}

function renderCustomDetail(body, d){
  if (d.autoEdge){
    const sw = devById(d.autoEdge.sw);
    body.append(el('h3', {}, `末端機器グループ(${(CTYPES[d.autoEdge.type] || CTYPES.other).label})`));
    body.append(el('div', { class: 'hint', style: 'margin-bottom:6px' },
      `${sw ? sw.hostname : '?'} 配下 ${d.autoEdge.hosts.length}台。MACテーブル/ARPから自動生成(再生成で更新されます)。`));
    const ht = el('table', { class: 'if' });
    ht.append(el('tr', {}, el('th', {}, 'ポート'), el('th', {}, 'MAC'), el('th', {}, 'IP'), el('th', {}, 'VLAN'), el('th', {}, 'ベンダ')));
    const hosts = [...d.autoEdge.hosts].sort((a, b) => a.port.localeCompare(b.port, undefined, { numeric: true }));
    for (const h of hosts.slice(0, 300))
      ht.append(el('tr', {}, el('td', {}, shortIf(h.port)),
        el('td', { style: 'font-family:var(--mono)' }, h.mac),
        el('td', { style: 'font-family:var(--mono)' }, h.ip || '-'),
        el('td', {}, String(h.vlan)), el('td', {}, h.vendor || '-')));
    body.append(ht);
    if (hosts.length > 300) body.append(el('div', { class: 'hint' }, `…他 ${hosts.length - 300}台`));
  }
  body.append(el('h3', {}, 'オブジェクト編集'));
  const kv = el('div', { class: 'kv' });
  const nmIn = el('input', { type: 'text', value: d.hostname });
  nmIn.addEventListener('change', () => {
    const v = nmIn.value.trim();
    if (!v) return;
    if (state.devices.some(x => x !== d && x.hostname === v)) return toast('同名の機器が既に存在します');
    d.hostname = v; renderAll();
  });
  const tySel = el('select');
  Object.entries(CTYPES).forEach(([k, c]) =>
    tySel.append(el('option', { value: k, ...(k === d.ctype ? { selected: '' } : {}) }, c.label)));
  tySel.addEventListener('change', () => { d.ctype = tySel.value; renderAll(); });
  const ipIn = el('input', { type: 'text', value: d.mgmtIp || '', placeholder: '例: 192.168.1.10' });
  ipIn.addEventListener('change', () => { d.mgmtIp = ipIn.value.trim(); renderAll(); });
  kv.append(el('b', {}, '名前'), nmIn);
  kv.append(el('b', {}, '種別'), tySel);
  kv.append(el('b', {}, '代表IP'), ipIn);
  const nLinks = state.links.filter(l => l.a.dev === d.id || l.b.dev === d.id).length;
  kv.append(el('b', {}, '接続数'), el('span', {}, nLinks + ' 本'));
  body.append(kv);

  body.append(el('h3', {}, 'ポート(カンマ区切りで編集)'));
  const portsIn = el('input', { type: 'text', value: Object.keys(d.interfaces).join(', '), style: 'width:100%' });
  portsIn.addEventListener('change', () => {
    const names = portsIn.value.split(',').map(s => s.trim()).filter(Boolean);
    if (!names.length) return toast('ポートを1つ以上指定してください');
    const old = d.interfaces; d.interfaces = {};
    names.forEach(n => d.interfaces[n] = old[n] || newIfEntry('utp'));
    renderAll();
  });
  body.append(portsIn,
    el('div', { style: 'font-size:10.5px;color:var(--txt-dim);margin-top:4px' },
      '※ 接続の追加・ケーブル種別は「接続」タブで設定できます'));

  body.append(el('h3', {}, '設置場所(物理図のグループ)'));
  const locIn = el('input', { type: 'text', list: 'locList', value: d.location || '', placeholder: '例: 本社3F サーバ室 Rack-A', style: 'width:100%' });
  locIn.addEventListener('change', () => { d.location = locIn.value.trim(); renderAll(); });
  body.append(locIn, locDatalist());
}

function renderSideDetail(body){
  const selDevs = state.sel.map(devById).filter(Boolean);
  if (selDevs.length >= 2){ renderBulkPanel(body, selDevs); return; }
  if (state.selectedNote){
    const n = state.notes.find(x => x.id === state.selectedNote);
    if (n){ renderNoteDetail(body, n); return; }

      el('td', {}, it.desc || '')));
  }
  tbl.append(frag);
  body.append(tbl);
}

// ---------------- export ----------------
function svgForExport(){
  const svg = $('#diagramSvg');
  if (!svg) return null;
  const clone = svg.cloneNode(true);
  clone.style.backgroundImage = 'none'; clone.style.width = ''; clone.style.height = '';
  inlineStyles(svg, clone);
  const w = +svg.getAttribute('width'), h = +svg.getAttribute('height');
  const ns = 'http://www.w3.org/2000/svg';
  const bg = document.createElementNS(ns, 'rect');
  bg.setAttribute('x', 0); bg.setAttribute('y', 0);
  bg.setAttribute('width', w); bg.setAttribute('height', h);
  bg.setAttribute('fill', '#FFFFFF');
  clone.insertBefore(bg, clone.firstChild);
  return { clone, w, h };
}
function fileStem(){
  const base = (state.projectName || 'network').replace(/[\\/:*?"<>|]/g, '_');
  const v = state.view === 'logical' ? 'logical' : state.view === 'l3' ? 'L3' : 'physical';
  return `${base}-${v}-${new Date().toISOString().slice(0,10)}`;
}
function exportSvg(){
  if (state.view === 'table'){ toast('一覧表は各表の「CSV出力」ボタンをご利用ください'); return; }
  const s = svgForExport(); if (!s) return;
  const xml = new XMLSerializer().serializeToString(s.clone);
  const blob = new Blob([xml], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fileStem() + '.svg'; a.click();
  URL.revokeObjectURL(a.href);
  toast('SVGを出力しました。PowerPointに直接挿入でき、拡大しても劣化しません');
}
function exportPng(){
  if (state.view === 'table'){ toast('一覧表は各表の「CSV出力」ボタンをご利用ください'); return; }
  const s = svgForExport(); if (!s) return;
  const { w, h } = s;
  const MAXDIM = 16000;
  let scale = 2;
  if (Math.max(w, h) * scale > MAXDIM)
    scale = Math.max(0.4, Math.floor(MAXDIM / Math.max(w, h) * 10) / 10);
  const xml = new XMLSerializer().serializeToString(s.clone);
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const cx = cv.getContext('2d');
    cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, cv.width, cv.height);
    cx.scale(scale, scale); cx.drawImage(img, 0, 0);
    const a = document.createElement('a');
    a.href = cv.toDataURL('image/png');
    a.download = fileStem() + '.png';
    a.click();
    toast(`PNGを出力しました(${scale}倍解像度・${cv.width}×${cv.height}px)` +
      (scale < 2 ? ' ※大規模図のため解像度を自動調整。高精細が必要な場合はSVG出力を推奨' : ''));
  };
  img.onerror = () => toast('PNG出力に失敗しました。SVG出力をお試しください');
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
}
function inlineStyles(src, dst){
  const sw = src.querySelectorAll('*'), dw = dst.querySelectorAll('*');
  const props = ['fill','stroke','stroke-width','stroke-dasharray','font-family','font-size','font-weight','opacity','text-anchor'];
  sw.forEach((s, i) => {
    const cs = getComputedStyle(s);
    for (const p of props){
      const v = cs.getPropertyValue(p);
      if (v && v !== 'none' || p === 'fill' || p === 'stroke') dw[i].setAttribute(p, v || 'none');
    }
    dw[i].removeAttribute('class');
  });
}


// ---------------- 一覧表ビュー ----------------
function allVlanIds(){
  const vs = new Set();
  state.devices.forEach(d => {
    Object.keys(d.vlans).forEach(v => vs.add(+v));
    Object.entries(d.interfaces).forEach(([p, it]) => {
      const sm = p.match(/^Vlan(\d+)$/); if (sm) vs.add(+sm[1]);
      if (it.dot1q) vs.add(it.dot1q);
    });
  });
  return [...vs].sort((a, b) => a - b);
}
function vlanTable(){
  const roots = stpRoots();
  const rootByVlan = {};
  Object.entries(roots).forEach(([id, vls]) => vls.forEach(v => rootByVlan[v] = devById(id)?.hostname || ''));
  const rows = [];
  for (const v of allVlanIds()){
    const name = state.devices.map(d => d.vlans[v]).find(Boolean) || '';
    const ipsArr = [], defsArr = [];
    for (const d of state.devices){
      const has = (v in d.vlans) || !!d.interfaces['Vlan' + v] ||
        Object.values(d.interfaces).some(it => it.dot1q === v);
      if (has) defsArr.push(d.hostname);
      const svi = d.interfaces['Vlan' + v];
      if (svi && svi.ip){
        let s = d.hostname + ': ' + ipDisp(svi.ip);
        (svi.fhrp || []).forEach(f => s += ` [${f.type}${f.grp} VIP ${f.vip}]`);
        ipsArr.push(s);
      }
    }
    rows.push([String(v), name, rootByVlan[v] || '', ipsArr.join('\n'), defsArr.join(', ')]);
  }
  return { headers: ['VLAN', '名前', 'STPルート', 'SVI IP / 仮想IP', '定義機器'], rows };
}
function deviceTable(){
  const rows = state.devices.map(d => [
    d.hostname, kindLabel(d),
    stackCount(d) > 1 ? Object.entries(d.stack).map(([n, mo]) => '#' + n + (mo ? ' ' + mo : '')).join('\n') : '',
    routingStr(d) || '-',
    String((d.acls || []).length),
    String(Object.keys(d.vlans).length),
    String(Object.keys(d.interfaces).filter(isPhysicalIf).length),
    d.location || '']);
  return { headers: ['ホスト名', '種別', 'スタック構成', 'ルーティング', 'ACL数', 'VLAN数', '物理IF数', '設置場所'], rows };
}
function ipTable(){
  const rows = [];
  for (const d of state.devices){
    if (d.custom && d.mgmtIp)
      rows.push([d.hostname, '-', d.mgmtIp, '', '代表IP', (CTYPES[d.ctype] || CTYPES.other).label]);
    for (const [p, it] of Object.entries(d.interfaces)){
      if (!it.ip && !(it.ips && it.ips.length)) continue;
      const ips = (it.ips && it.ips.length ? it.ips : [it.ip]).map(ipDisp).join('\n');
      const fh = (it.fhrp || []).map(f => `${f.type}${f.grp}: ${f.vip}`).join('\n');
      const note = /^Vlan/.test(p) ? 'SVI' : it.dot1q ? 'dot1Q ' + it.dot1q : /^Loopback/.test(p) ? 'Loopback' : 'L3';
      rows.push([d.hostname, shortIf(p), ips, fh, note, it.desc || '']);
    }
  }
  return { headers: ['機器', 'インターフェース', 'IPアドレス', 'FHRP(仮想IP)', '種別', 'Description'], rows };
}
function toCsv(tbl){
  const esc = v => '"' + String(v).replace(/"/g, '""') + '"';
  return '\ufeff' + [tbl.headers.map(esc).join(','), ...tbl.rows.map(r => r.map(esc).join(','))].join('\r\n');
}
function downloadCsv(tbl, name){
  const blob = new Blob([toCsv(tbl)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

// ---------------- JSON save/load ----------------
function computeSeq(){
  let mx = 0;
  const scan = id => { const m = /^id(\d+)$/.exec(id || ''); if (m) mx = Math.max(mx, +m[1]); };
  state.devices.forEach(d => scan(d.id));
  state.links.forEach(l => scan(l.id));
  state.notes.forEach(n => scan(n.id));
  return mx + 1;
}
// 過去バージョンの採番バグ等で重複したIDを修復(後勝ちの方に新IDを振り直す)
function repairDuplicateIds(){
  const seen = new Set();
  let fixed = 0;
  for (const arr of [state.devices, state.notes, state.links]){
    for (const o of arr){
      if (seen.has(o.id)){ o.id = 'id' + (state.seq++); fixed++; }
      seen.add(o.id);
    }
  }
  return fixed;
}
function normalizeState(){
  normalizeDevices();
  state.seq = computeSeq();
  const fixed = repairDuplicateIds();
  if (fixed) setTimeout(() => toast(`データ内の重複IDを ${fixed} 件修復しました`), 600);
}
function normalizeDevices(){
  state.devices.forEach(d => {
    d.staticRoutes = d.staticRoutes || 0; d.routing = d.routing || [];
    d.acls = d.acls || []; d.stack = d.stack || {};
    if (d.custom && !d.ctype) d.ctype = 'other';
    if (d.dispType === undefined) d.dispType = '';
    Object.values(d.interfaces || {}).forEach(it => {
      it.fhrp = it.fhrp || []; it.ips = it.ips || (it.ip ? [it.ip] : []);
      if (it.dot1q === undefined) it.dot1q = null;
    });
  });
}
function buildProjectJson(){
  return JSON.stringify({ projectName: state.projectName, savedAt: new Date().toISOString(),
    devices: state.devices, links: state.links, notes: state.notes, l3SegPos: state.l3SegPos, arp: state.arp }, null, 1);
}
function downloadBlob(content, type, fname){
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  URL.revokeObjectURL(a.href);
}
function openSaveDialog(){

function closeSaveDialog(){

function doSaveJson(name){

function loadJson(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      state.devices = j.devices || []; state.links = j.links || [];
      state.notes = (j.notes || []).map(n => ({ view: 'logical', ...n }));
      state.l3SegPos = j.l3SegPos || {};
    state.arp = j.arp || state.arp || {};
      state.projectName = j.projectName || file.name.replace(/\.json$/i, '');
      normalizeState();
      toast('読み込みました: ' + (state.projectName || file.name)); renderAll();
    } catch { toast('JSONの読み込みに失敗しました'); }
  };
  r.readAsText(file);
}

// ---------------- Undo / Redo ----------------
const HIST_MAX = 60;
const _hist = [];
let _histIdx = -1;
let _restoring = false;
function snapshot(){ return JSON.stringify({ devices: state.devices, links: state.links, notes: state.notes, l3SegPos: state.l3SegPos, arp: state.arp }); }
function commitHistory(){
  if (_restoring) return;
  const s = snapshot();
  if (_histIdx >= 0 && _hist[_histIdx] === s) return;
  _hist.splice(_histIdx + 1);
  _hist.push(s);
  if (_hist.length > HIST_MAX) _hist.shift();
  _histIdx = _hist.length - 1;
  updateUndoButtons();
}
function restoreSnapshot(s){
  _restoring = true;
  try {
    const j = JSON.parse(s);
    state.devices = j.devices || []; state.links = j.links || []; state.notes = j.notes || [];
    state.l3SegPos = j.l3SegPos || {};
    state.arp = j.arp || state.arp || {};
    normalizeDevices();
    state.seq = computeSeq();
    state.sel = [];
    if (state.selectedDevice && !devById(state.selectedDevice)) state.selectedDevice = null;
    if (state.selectedNote && !state.notes.some(n => n.id === state.selectedNote)) state.selectedNote = null;
    editingLink = null;
    renderAll();
  } finally { _restoring = false; }
}
function undo(){
  if (_histIdx <= 0){ toast('これ以上元に戻せません'); return; }
  _histIdx--;
  restoreSnapshot(_hist[_histIdx]);
  updateUndoButtons();
  toast('元に戻しました (Ctrl+Y でやり直し)');
}
function redo(){
  if (_histIdx >= _hist.length - 1){ toast('やり直す操作がありません'); return; }
  _histIdx++;
  restoreSnapshot(_hist[_histIdx]);
  updateUndoButtons();
  toast('やり直しました');
}
function updateUndoButtons(){
  const u = $('#btnUndo'), r = $('#btnRedo');
  if (u) u.disabled = _histIdx <= 0;
  if (r) r.disabled = _histIdx >= _hist.length - 1;
}

// ---------------- 自動保存(ブラウザ終了対策) ----------------
const AS_KEY = 'cfgnet.autosave.v1';
function lsAvailable(){
  try { localStorage.setItem('__cfgnet_t', '1'); localStorage.removeItem('__cfgnet_t'); return true; }
  catch { return false; }
}
const _ls = lsAvailable();
let _asT = 0;
function scheduleAutosave(){
  clearTimeout(_asT);
  _asT = setTimeout(() => { saveAutosave(); commitHistory(); }, 700);
}
function saveAutosave(){
  if (!_ls) return;
  if (!state.devices.length && !state.links.length && !state.notes.length) return; // 空の状態で上書きしない
  try {
    localStorage.setItem(AS_KEY, JSON.stringify({ ts: Date.now(), projectName: state.projectName,
      devices: state.devices, links: state.links, notes: state.notes, l3SegPos: state.l3SegPos, arp: state.arp }));
    const s = $('#asStatus');
    if (s) s.textContent = '自動保存 ' + new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  } catch {}
}
function tryRestoreAutosave(){
  if (!_ls) return false;
  try {
    const raw = localStorage.getItem(AS_KEY);
    if (!raw) return false;
    const j = JSON.parse(raw);
    if (!j.devices || !j.devices.length) return false;
    state.devices = j.devices; state.links = j.links || [];
    state.notes = (j.notes || []).map(n => ({ view: 'logical', ...n }));
    state.l3SegPos = j.l3SegPos || {};
    state.arp = j.arp || state.arp || {};
    state.projectName = j.projectName || '';
    normalizeState();
    toast('前回の編集状態を復元しました(' + new Date(j.ts).toLocaleString('ja-JP') + ')');
    return true;
  } catch { return false; }
}
function clearAll(){
  if (!window.confirm('現在の内容(機器・接続)をすべてクリアします。よろしいですか？')) return;
  state.devices = []; state.links = []; state.notes = []; state.projectName = '';
  state.l3SegPos = {}; state.arp = {};
  state.selectedDevice = null; state.selectedNote = null; state.sel = [];
  editingLink = null;
  if (_ls){ try { localStorage.removeItem(AS_KEY); } catch {} }
  const s = $('#asStatus'); if (s) s.textContent = '';
  toast('クリアしました');
  renderAll();
}

function loadSample(){
  importConfigs(SAMPLE);
  const loc = { 'CORE-SW1': '本社3F サーバ室 Rack-A', 'CORE-SW2': '本社3F サーバ室 Rack-B',
    'ACC-SW1': '本社2F EPS', 'ACC-SW2': '本社4F EPS', 'FW-01': '本社3F サーバ室 Rack-A',
    'RT-01': '本社3F サーバ室 Rack-A' };
  state.devices.forEach(d => { if (loc[d.hostname]) d.location = loc[d.hostname]; });
  if (!state.notes.some(n => n.text.includes('HSRP')))
    state.notes.push({ id: uid(), view: 'logical', x: 640, y: 24,
      text: 'コアはHSRP+Po1(LACP)で冗長化\nRT-01経由でWANへ接続', color: '#FFF7CC' });
  autoLayout();
}

// ---------------- wiring ----------------
function populateVlanFilter(){
  const sel = $('#vlanFilter'); if (!sel) return;
  const cur = sel.value;
  sel.innerHTML = '';
  sel.append(el('option', { value: '' }, 'VLAN絞込なし'));
  const vs = new Set();
  state.devices.forEach(d => {
    Object.keys(d.vlans).forEach(v => vs.add(+v));
    Object.entries(d.interfaces).forEach(([p, it]) => {
      const sm = p.match(/^Vlan(\d+)$/); if (sm) vs.add(+sm[1]);
      if (it.dot1q) vs.add(it.dot1q);
    });
  });
  [...vs].sort((a,b)=>a-b).forEach(v => {
    const names = state.devices.map(d => d.vlans[v]).filter(Boolean);
    sel.append(el('option', { value: v }, 'VLAN ' + v + (names[0] ? ' (' + names[0] + ')' : '')));
  });
  if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
  else { sel.value = ''; state.vlanFilter = ''; }
}
function renderAll(){ populateVlanFilter(); renderSide(); renderCanvas(); scheduleAutosave(); }

document.querySelectorAll('.side-tabs button').forEach(b =>
  b.addEventListener('click', () => { state.sideTab = b.dataset.st; renderSide(); }));
function updateViewBar(){
  const l3 = state.view === 'l3';
  const t = $('#l3Tools'); if (t) t.style.display = l3 ? 'flex' : 'none';
  const s = $('#btnSyncLayout'); if (s) s.style.display = l3 ? 'none' : '';
  const q = $('#devSearch');
  if (q){
    q.placeholder = l3 ? '機器名・IPで検索' : '機器名で検索';
    q.title = l3 ? '機器名のほか、IPアドレスやネットワークアドレス(例: 10.1.2 / 10.1.2.0/24)でも検索できます' : '';
  }
}
document.querySelectorAll('.vtab').forEach(b =>
  b.addEventListener('click', () => {
    state.view = b.dataset.v;
    document.querySelectorAll('.vtab').forEach(x => x.classList.toggle('on', x === b));
    updateViewBar();
    renderCanvas();
  }));
$('#chkL2').addEventListener('change', e => {
  state.showL2 = e.target.checked;
  if (state.view === 'l3') renderCanvas();
});
$('#btnL3Auto').addEventListener('click', () => {
  if (!state.devices.length) return toast('機器がありません');
  l3AutoLayout();
});
$('#btnL3FromLogical').addEventListener('click', () => {
  if (!state.devices.length) return toast('機器がありません');
  state.devices.forEach(d => { if (d.pos) d.l3Pos = { ...d.pos }; });
  if (L3M) L3M.segs.forEach(s => delete state.l3SegPos[s.key]); // セグメントは新しい配置に付け直し
  toast('論理図の配置をL3図へ反映しました(セグメントは再配置)');
  if (state.view === 'l3') renderCanvas();
  scheduleAutosave();
});

$('#btnSyncLayout').addEventListener('click', () => {
  if (!state.devices.length) return toast('機器がありません');
  state.devices.forEach(d => { if (d.pos) d.physPos = { ...d.pos }; });
  toast('論理図の配置を物理図へコピーしました');
  if (state.view === 'physical') renderCanvas();
  scheduleAutosave();
});
document.addEventListener('keydown', e => {
  const tg = e.target;
  const typing = tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA' || tg.tagName === 'SELECT');
  if ((e.ctrlKey || e.metaKey) && !typing && (e.key.toLowerCase() === 'z' || e.key.toLowerCase() === 'y')){
    e.preventDefault();
    if (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey)) redo();
    else undo();
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a' && !typing){
    if (state.view === 'table') return;
    e.preventDefault();
    selectAll();
    toast(`${state.sel.length}件を選択しました(まとめてドラッグで移動 / Escで解除)`);
  } else if (e.key === 'Escape' && !typing){
    state.sel = []; refreshSelClasses();
  }
});
let _searchT = 0;
$('#devSearch').addEventListener('input', e => {
  clearTimeout(_searchT);
  _searchT = setTimeout(() => { state.search = e.target.value; renderCanvas(); }, 200);
});
$('#canvasHolder').addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const r = e.currentTarget.getBoundingClientRect();
  zoomBy(e.deltaY < 0 ? 1.15 : 1/1.15, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

tryRestoreAutosave();
updateViewBar();
renderAll();
commitHistory(); // 初期状態を履歴に登録
updateUndoButtons();
